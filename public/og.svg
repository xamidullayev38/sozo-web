<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <radialGradient id="bloom" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="12%" cy="88%" r="55%">
      <stop offset="0" stop-color="#FF3D9A" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FF3D9A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#08080C"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" fill="url(#bloom2)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#16161F" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(96,96)">
    <rect width="88" height="88" rx="22" fill="#101018" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <text x="44" y="62" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="56" font-weight="900" fill="url(#accent)">S</text>
    <text x="112" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="42"
          font-weight="800" letter-spacing="2" fill="#F4F4F8">SOZO</text>
  </g>

  <!-- headline -->
  <text x="96" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="82"
        font-weight="900" fill="#F4F4F8">Every anime,</text>
  <text x="96" y="428" font-family="'Segoe UI', Arial, sans-serif" font-size="82"
        font-weight="900" fill="url(#accent)">right in your hands.</text>

  <!-- subline -->
  <text x="98" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="34"
        font-weight="400" fill="#A6A6B4">Stream 1000+ titles in HD — phone, TV, desktop.</text>

  <!-- platform chips -->
  <g transform="translate(98,548)" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#CFCFDA">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="#101018" stroke="#26263A"/>
    <text x="75" y="29" text-anchor="middle">Android TV</text>
    <rect x="166" y="0" width="130" height="44" rx="22" fill="#101018" stroke="#26263A"/>
    <text x="231" y="29" text-anchor="middle">Android</text>
    <rect x="312" y="0" width="130" height="44" rx="22" fill="#101018" stroke="#26263A"/>
    <text x="377" y="29" text-anchor="middle">Desktop</text>
  </g>
</svg>
